<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wavelength — Audience</title>
    <meta name="description" content="The audience screen for the Wavelength game: the spectrum, the needle, and the scores, without the target." />
    <meta name="robots" content="noindex" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css?v=76" />
</head>

<body class="warp audience">
    <button type="button" id="fullscreenButton" class="fullscreen-button" title="Full screen (F)">
        <svg class="icon icon--enter" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5" />
            <path d="M20 9V4h-5" />
            <path d="M4 15v5h5" />
            <path d="M20 15v5h-5" />
        </svg>
        <svg class="icon icon--exit" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4v5H4" />
            <path d="M15 4v5h5" />
            <path d="M9 20v-5H4" />
            <path d="M15 20v-5h5" />
        </svg>
        <span class="fullscreen-label">Full screen</span>
    </button>

    <div class="game-container audience-container">
        <h1 class="title">
            <svg class="title-wave" viewBox="0 0 64 16" aria-hidden="true" preserveAspectRatio="none">
                <path d="M-16 8q4-6 8 0t8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0" />
            </svg>
            <span>Wavelength</span>
            <svg class="title-wave" viewBox="0 0 64 16" aria-hidden="true" preserveAspectRatio="none">
                <path d="M-16 8q4-6 8 0t8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0 8 0" />
            </svg>
        </h1>

        <div id="audienceWaiting" class="audience-waiting">
            <p>Waiting for the game to start&hellip;</p>
            <p class="audience-hint">Keep this window on the big screen and play from the other one.</p>
            <p class="audience-hint">Press <kbd>F</kbd> for full screen, <kbd>Esc</kbd> to leave it.</p>
        </div>

        <div id="audienceRound" class="audience-round"></div>
        <div id="roundProgressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="10"
            aria-valuenow="0" aria-label="Rounds played">
            <div id="roundProgressFill"></div>
        </div>
        <h2 id="audienceTurn" class="audience-turn"></h2>
        <div id="audienceMessage" class="audience-message" role="status" aria-live="polite"></div>

        <div id="gameBoardAndCluesContainer">
            <div class="dial-waves" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="board">
                <div class="target-area" id="targetArea"></div>
                <div class="dial-cover" aria-hidden="true"></div>
                <div class="needle-container" id="needleContainer" role="slider"
                    aria-label="The guess on the spectrum"
                    aria-valuemin="-90" aria-valuemax="90" aria-valuenow="0"
                    aria-valuetext="Centre of the spectrum">
                    <div class="needle" id="needle"></div>
                </div>
            </div>
            <div class="dial-hub" id="dialHub"></div>
            <div class="clues-container" role="group" aria-label="This round's spectrum"
                aria-live="polite">
                <div class="clue" id="leftClue"></div>
                <div class="bidirectional-arrow" aria-hidden="true"></div>
                <div class="clue" id="rightClue"></div>
            </div>
        </div>

        <ol id="audienceScores" class="audience-scores" aria-label="Scores"></ol>
    </div>

    <!-- Final score card for the room. Read-only: the presenter drives what
         happens next. -->
    <div id="audienceGameOver" class="modal" role="dialog" aria-modal="false" aria-labelledby="audienceWinner">
        <div class="modal-content">
            <h2 id="audienceWinner"></h2>
            <div class="modal-body">
                <p class="final-scores-label">Final scores</p>
                <ol id="audienceFinalScores" class="final-scores"></ol>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="stars.js?v=74"></script>
    <script src="audience.js?v=77"></script>
</body>

</html>
